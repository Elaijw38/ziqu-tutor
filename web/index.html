<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>甲骨文助教 · 字趣 AI</title>
<style>
  :root{
    --bone:#f4ecda; --bone-white:#fffdf8; --ink:#2f2618; --ink-soft:#6b5b44;
    --edge:#ddd0b6; --cinnabar:#a8321e; --gold:#b98b3c;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; color:var(--ink);
    font:15px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(ellipse at 20% 0%, #fffdf7 0%, transparent 58%),
      linear-gradient(160deg,#f7f1e3,#efe4cd 60%,#e6d8bd);
  }
  .wrap{max-width:900px;margin:0 auto;padding:28px 18px 60px}
  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  h1{margin:0;font-size:22px;letter-spacing:1px}
  .seal{display:inline-block;padding:2px 8px;border:1px solid var(--cinnabar);
    color:var(--cinnabar);border-radius:3px;font-size:12px;letter-spacing:2px}
  .sub{color:var(--ink-soft);font-size:13px;margin:6px 0 18px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .chip{padding:5px 11px;border:1px solid var(--edge);border-radius:999px;
    background:var(--bone-white);font-size:12.5px;color:var(--ink-soft);
    cursor:pointer;transition:.15s}
  .chip:hover{border-color:var(--gold);color:var(--ink)}
  .panel{background:var(--bone-white);border:1px solid var(--edge);border-radius:12px;
    box-shadow:0 2px 10px rgba(80,60,30,.06);overflow:hidden}
  .log{padding:16px;max-height:52vh;overflow:auto}
  .msg{margin:0 0 14px}
  .who{font-size:11.5px;letter-spacing:1px;color:var(--ink-soft);margin-bottom:4px}
  .ask .bubble{background:#f0e7d3;border:1px solid var(--edge);border-radius:10px;
    padding:9px 12px;display:inline-block;max-width:100%}
  .ans .bubble{background:#fffefb;border:1px solid var(--edge);border-left:3px solid var(--gold);
    border-radius:10px;padding:11px 13px;white-space:pre-wrap}
  .cite{margin-top:9px;border-top:1px dashed var(--edge);padding-top:8px}
  .cite summary{cursor:pointer;font-size:12.5px;color:var(--ink-soft)}
  .cite ol{margin:6px 0 0 18px;padding:0;font-size:12.5px;color:var(--ink-soft)}
  .cite li{margin:3px 0;word-break:break-all}
  .mode{font-size:11px;color:var(--gold);margin-left:6px}
  form{display:flex;gap:9px;padding:12px;border-top:1px solid var(--edge);background:#fbf6ea}
  input[type=text]{flex:1;padding:11px 13px;border:1px solid var(--edge);border-radius:9px;
    font-size:14.5px;background:#fff;color:var(--ink);outline:none}
  input[type=text]:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(185,139,60,.14)}
  button{padding:11px 20px;border:0;border-radius:9px;background:var(--cinnabar);
    color:#fff;font-size:14.5px;letter-spacing:1px;cursor:pointer}
  button:disabled{opacity:.55;cursor:default}
  footer{margin-top:14px;font-size:12px;color:var(--ink-soft);line-height:1.8}
  footer b{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>甲骨文助教</h1>
    <span class="seal">AI 智能体</span>
    <span class="mode" id="mode"></span>
  </header>
  <p class="sub">问字形怎么来的、某个字怎么打、王邑图里代表什么。每条回答都附原文出处，可核对。</p>

  <div class="chips" id="chips"></div>

  <div class="panel">
    <div class="log" id="log"></div>
    <form id="f">
      <input type="text" id="q" placeholder="例如：家为什么是屋顶下有猪" autocomplete="off">
      <button type="submit" id="send">问</button>
    </form>
  </div>

  <footer>
    答案只来自本地知识库，<b>不编造</b>；知识库覆盖 146 个汉字。<br>
    字形数据：hanzi-glyphs-svg / Zenodo，CC BY 4.0，DOI 10.5281/zenodo.22467946。
  </footer>
</div>

<script>
const EXAMPLES = [
  "日为什么写成圆的",
  "家为什么是屋顶下有猪",
  "虎怎么打",
  "宀是什么意思",
  "构件是什么"
];
const log = document.getElementById('log');
const form = document.getElementById('f');
const input = document.getElementById('q');
const send = document.getElementById('send');

function el(tag, cls, text){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function scroll(){ log.scrollTop = log.scrollHeight; }

function addAsk(q){
  const m = el('div','msg ask');
  m.appendChild(el('div','who','你'));
  m.appendChild(el('div','bubble', q));
  log.appendChild(m); scroll();
}

function addAnswer(a){
  const m = el('div','msg ans');
  m.appendChild(el('div','who','助教'));
  m.appendChild(el('div','bubble', a.answer));
  if (a.citations && a.citations.length){
    const d = el('details','cite');
    d.appendChild(el('summary', null, '出处 · ' + a.citations.length + ' 条（点开核对）'));
    const ol = el('ol');
    a.citations.forEach(c => ol.appendChild(el('li', null, c.source)));
    d.appendChild(ol);
    m.appendChild(d);
  }
  log.appendChild(m); scroll();
}

async function ask(q){
  q = (q || '').trim();
  if (!q) return;
  addAsk(q);
  input.value = '';
  send.disabled = true;
  try{
    const r = await fetch('/api/ask', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({question: q})
    });
    const a = await r.json();
    if (a.error){ addAnswer({answer:'服务出错：' + a.error, citations:[]}); }
    else addAnswer(a);
  }catch(e){
    addAnswer({answer:'连不上本地服务（是否启动了 src/server.py？）', citations:[]});
  }finally{
    send.disabled = false;
    input.focus();
  }
}

const chips = document.getElementById('chips');
EXAMPLES.forEach(q => {
  const b = el('button','chip', q);
  b.type = 'button';
  b.onclick = () => ask(q);
  chips.appendChild(b);
});

form.addEventListener('submit', e => { e.preventDefault(); ask(input.value); });

fetch('/api/health').then(r => r.json()).then(h => {
  document.getElementById('mode').textContent =
    '知识库 ' + h.kb_rows + ' 条 / 覆盖 ' + h.chars + ' 字 · ' +
    (h.llm ? '已接入大模型' : '本地检索模式');
}).catch(() => {});

ask('日为什么写成圆的');
</script>
</body>
</html>
